name: Import V0.5 baseline

on:
  push:
    branches: [main]
    paths:
      - baseline/chunks/complete.marker

permissions:
  contents: write

jobs:
  import-v05:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack V0.5 source archive
        shell: bash
        run: |
          set -euo pipefail
          cat baseline/chunks/part-*.b64 | base64 --decode > /tmp/LingIoT-v0.5-source.tar.xz
          echo '171168eb4bcc2cc32a85aa7bb5c17f618f877d7c70179d3c65c7f2303671d515  /tmp/LingIoT-v0.5-source.tar.xz' | sha256sum --check --status
          mkdir -p baseline/v0.5
          tar -xJf /tmp/LingIoT-v0.5-source.tar.xz -C baseline/v0.5 --strip-components=1
          test "$(find baseline/v0.5 -type f | wc -l)" -eq 50
          rm -rf baseline/chunks
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add baseline/v0.5 baseline/chunks
          git commit -m 'chore: import complete V0.5 source baseline'
          git push