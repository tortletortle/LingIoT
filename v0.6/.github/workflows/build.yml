name: Build and test LingIoT
on: [push, workflow_dispatch]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash tests/run.sh
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LingIoT-v0.5-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.0.7 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install ArduinoJson@7.4.2
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build/firmware firmware/LingIoT
          arduino-cli compile --fqbn esp32:esp32:esp32 --build-property compiler.cpp.extra_flags=-DLINGIOT_ENABLE_MOTOR=1 --output-dir build/firmware-motor-enabled firmware/LingIoT
          arduino-cli compile --fqbn esp32:esp32:esp32 --build-property compiler.cpp.extra_flags='-DLINGIOT_ENABLE_RGB=0 -DLINGIOT_ENABLE_SERVO=0 -DLINGIOT_ENABLE_ANALOG=0' --output-dir build/firmware-minimal firmware/LingIoT
      - uses: actions/upload-artifact@v4
        with:
          name: LingIoT-v0.5-esp32-firmware
          path: build/firmware*
